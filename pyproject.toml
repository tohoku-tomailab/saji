[project]
name = "saji"
dynamic = ["version"]
description = "研究室の実験データ処理ツール群（CLI と ブラウザ内 Web の両用）"
readme = "README.md"
requires-python = ">=3.14"
keywords = ["XRD", "XPS", "CO2RR", "electrochemistry", "Pyodide"]
# Pyodide 314.0.7 に同梱されている版に合わせる（docs/maintenance.md 参照）
dependencies = [
    "numpy>=2.4,<2.5",
    "scipy>=1.18,<1.19",
    "pandas>=3.0,<3.1",
    "matplotlib>=3.10,<3.11",
    "pybaselines>=1.2",
]

[project.scripts]
saji = "saji.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/saji/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/saji"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
